name: ESP32-C3 USB-CDC web installer
on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Enable USB CDC on boot for ESP32-C3
        run: |
          sed -i '/^\[env:esp32-c3\]/,/^\[env:/ s/^\(\s*\)\${env\.build_flags}$/&\n\1-DARDUINO_USB_CDC_ON_BOOT=1/' platformio.ini
          sed -i '/^\[env:updater_esp32-c3\]/,/^\[env:/ s/^\(\s*\)\${env\.build_flags}$/&\n\1-DARDUINO_USB_CDC_ON_BOOT=1/' updater/platformio.ini
          grep -q 'ARDUINO_USB_CDC_ON_BOOT=1' platformio.ini
          grep -q 'ARDUINO_USB_CDC_ON_BOOT=1' updater/platformio.ini
          git diff

      - name: Add version info
        env:
          Version: usbcdc-${{ github.run_number }}
        run: sed -i "s/unknownbuildnr/$Version/g" src/Config.h

      - name: Build
        run: |
          make updater_esp32-c3
          make esp32-c3

      - name: Create web installer
        run: |
          mkdir -p site
          cp release/esp32c3/nuki_hub_bootloader_esp32c3.bin \
             release/esp32c3/nuki_hub_partitions_esp32c3.bin \
             release/esp32c3/boot_app0.bin \
             release/esp32c3/nuki_hub_esp32c3.bin \
             release/esp32c3/nuki_hub_updater_esp32c3.bin site/
          cat > site/manifest.json <<EOF
          {
            "name": "Nuki Hub ESP32-C3 (USB CDC logging)",
            "version": "usbcdc-${{ github.run_number }}",
            "new_install_prompt_erase": true,
            "builds": [
              {
                "chipFamily": "ESP32-C3",
                "parts": [
                  { "path": "nuki_hub_bootloader_esp32c3.bin", "offset": 0 },
                  { "path": "nuki_hub_partitions_esp32c3.bin", "offset": 32768 },
                  { "path": "boot_app0.bin", "offset": 57344 },
                  { "path": "nuki_hub_esp32c3.bin", "offset": 65536 },
                  { "path": "nuki_hub_updater_esp32c3.bin", "offset": 2555904 }
                ]
              }
            ]
          }
          EOF
          cat > site/index.html <<'EOF'
          <!doctype html>
          <html lang="nl">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Nuki Hub ESP32-C3 USB-CDC</title>
            <script type="module" src="https://unpkg.com/esp-web-tools@10.1.1/dist/web/install-button.js?module"></script>
            <style>body{font-family:system-ui,sans-serif;max-width:640px;margin:40px auto;padding:0 16px;line-height:1.5}</style>
          </head>
          <body>
            <h1>Nuki Hub ESP32-C3 (USB-CDC logging)</h1>
            <p>Nuki Hub firmware voor de ESP32-C3, met <code>ARDUINO_USB_CDC_ON_BOOT=1</code>, zodat de seri&euml;le log (115200 baud) over de native USB-poort komt.</p>
            <esp-web-install-button manifest="manifest.json"></esp-web-install-button>
            <p>Werkt in Chrome of Edge. Na het flashen kies je in het installer-venster "Logs &amp; Console" om de log te zien, met de regel <code>Obtained IP address</code>.</p>
          </body>
          </html>
          EOF
          ls -la site

      - uses: actions/upload-artifact@v7
        with:
          name: nukihub-esp32c3-usbcdc
          path: release/esp32c3

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
